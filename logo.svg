<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="arohaLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="arohaLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#818cf8" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2dd4bf" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#arohaLogoGlow)">
    <!-- Outer Chevron / Delta Apex -->
    <path d="M 50 10 L 15 85 L 32 85 L 50 48 L 68 85 L 85 85 Z" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Prism Lattice -->
    <path d="M 50 10 L 35 50 L 50 32 L 65 50 Z" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="2.5" />
    <!-- Horizontal Crossbars -->
    <path d="M 35 50 L 65 50 M 25 68 L 75 68" stroke="url(#arohaLogoGrad)" stroke-width="2" />
    <!-- Upward Growth & Traversal Vector Arrow -->
    <path d="M 30 75 L 70 35 M 70 35 H 52 M 70 35 V 53" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Geometric Constellation Nodes -->
    <circle cx="50" cy="10" r="3.5" fill="#2dd4bf" />
    <circle cx="15" cy="85" r="3.5" fill="#2dd4bf" />
    <circle cx="85" cy="85" r="3.5" fill="#c084fc" />
    <circle cx="70" cy="35" r="3.5" fill="#c084fc" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="auroraBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(45, 212, 191, 0.4)"/>
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.2)"/>
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.4)"/>
    </linearGradient>

    <!-- Main Geometric Logo Gradient (Cyan to Purple) -->
    <linearGradient id="arohaLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="arohaLogoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#2dd4bf" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Container Card -->
  <rect width="512" height="512" rx="112" fill="#050711"/>
  <rect width="512" height="512" rx="112" fill="url(#auroraBgGlow)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2"/>

  <!-- Scaled Centered Vector Geometry (3.5x scale, centered at 256, 256) -->
  <g transform="translate(81, 76) scale(3.5)" filter="url(#arohaLogoGlow)">
    <!-- Outer Delta Structure -->
    <path d="M 50 10 L 15 85 L 32 85 L 50 48 L 68 85 L 85 85 Z" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Prism Lattice -->
    <path d="M 50 10 L 35 50 L 50 32 L 65 50 Z" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="2.6" />
    <!-- Crossbars -->
    <path d="M 35 50 L 65 50 M 25 68 L 75 68" stroke="url(#arohaLogoGrad)" stroke-width="2.2" />
    <!-- Upward Growth & Traversal Vector Arrow -->
    <path d="M 30 75 L 70 35 M 70 35 H 52 M 70 35 V 53" fill="none" stroke="url(#arohaLogoGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Constellation Nodes -->
    <circle cx="50" cy="10" r="3.8" fill="#2dd4bf" />
    <circle cx="15" cy="85" r="3.8" fill="#2dd4bf" />
    <circle cx="85" cy="85" r="3.8" fill="#c084fc" />
    <circle cx="70" cy="35" r="3.8" fill="#c084fc" />
  </g>
</svg>
